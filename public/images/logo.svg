<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#946f1e" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b7d" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="#0c0d14" 
           stroke="url(#goldGrad)" 
           stroke-width="2.5" 
           filter="url(#glow)" />
           
  <!-- Inner Circuit Grid Accent -->
  <polygon points="50,14 80,31 80,69 50,86 20,69 20,31" 
           fill="none" 
           stroke="rgba(212, 175, 55, 0.2)" 
           stroke-width="1" 
           stroke-dasharray="3,3" />

  <!-- Crimson Accent Corner Pins -->
  <circle cx="50" cy="14" r="2" fill="url(#crimsonGrad)" />
  <circle cx="80" cy="69" r="2" fill="url(#crimsonGrad)" />
  <circle cx="20" cy="69" r="2" fill="url(#crimsonGrad)" />

  <!-- Futuristic Minimal X Symbol -->
  <path d="M30 30 L70 70 M30 70 L46 54 M70 30 L54 46" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Central Energy Core Dot -->
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="50" cy="50" r="1.5" fill="url(#crimsonGrad)" />
</svg>

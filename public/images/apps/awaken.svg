<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="awakenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191a27" />
      <stop offset="100%" stop-color="#0a0b12" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#946f1e" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7385" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#awakenBg)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Dial Time Arc -->
  <circle cx="60" cy="60" r="36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />
  <path d="M 60 24 A 36 36 0 1 1 27 75" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bell / Chime Silhouette with Golden Resonance -->
  <path d="M60 38 C53 38 48 43 48 50 L48 64 L42 68 L78 68 L72 64 L72 50 C72 43 67 38 60 38 Z" 
        fill="rgba(212, 175, 55, 0.15)" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Bell Clapper -->
  <path d="M56 68 C56 70.2 57.8 72 60 72 C62.2 72 64 70.2 64 68" stroke="url(#crimsonGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Hourly Sound Waves Pulse -->
  <path d="M78 46 C83 50 83 58 78 62" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M84 41 C91 47 91 63 84 69" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <path d="M42 46 C37 50 37 58 42 62" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M36 41 C29 47 29 63 36 69" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Top Alarm Pin Dot -->
  <circle cx="60" cy="32" r="2.5" fill="url(#crimsonGrad)" filter="url(#glow)" />
</svg>

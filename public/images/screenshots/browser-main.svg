<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d069" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a26" />
      <stop offset="100%" stop-color="#10111a" />
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="1200" height="750" rx="16" fill="url(#bgGrad)" stroke="rgba(212,175,55,0.25)" stroke-width="2" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1200" height="48" rx="16" fill="#0b0c12" />
  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#e63946" />
  <circle cx="48" cy="24" r="6" fill="#d4af37" />
  <circle cx="68" cy="24" r="6" fill="#2a9d8f" />

  <!-- Browser Tabs -->
  <path d="M100 48 L112 16 L290 16 L302 48 Z" fill="#141622" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
  <text x="135" y="32" fill="#e5c158" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ Xtreme AI Browser - Active</text>
  
  <path d="M306 48 L314 22 L460 22 L468 48 Z" fill="#0d0e16" />
  <text x="328" y="34" fill="#8e90a6" font-family="system-ui, sans-serif" font-size="12">Research Workspace</text>

  <!-- Navigation / URL Bar -->
  <rect x="0" y="48" width="1200" height="52" fill="#10121c" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <!-- Navigation buttons -->
  <circle cx="30" cy="74" r="14" fill="#181a26" />
  <text x="25" y="78" fill="#a0a2b5" font-size="14">‹</text>
  <circle cx="65" cy="74" r="14" fill="#181a26" />
  <text x="60" y="78" fill="#a0a2b5" font-size="14">›</text>
  <circle cx="100" cy="74" r="14" fill="#181a26" />
  <text x="95" y="78" fill="#a0a2b5" font-size="12">↻</text>

  <!-- Omnibar Address Field -->
  <rect x="135" y="58" width="820" height="32" rx="8" fill="#090a10" stroke="rgba(212,175,55,0.3)" stroke-width="1" />
  <text x="155" y="78" fill="#2a9d8f" font-family="monospace" font-size="12">🔒 https://</text>
  <text x="220" y="78" fill="#f4f4f7" font-family="system-ui, sans-serif" font-size="12">xtremerpie.dev/workspace/ai-companion</text>
  
  <rect x="850" y="64" width="90" height="20" rx="4" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
  <text x="858" y="78" fill="#e5c158" font-family="system-ui, sans-serif" font-size="10" font-weight="600">🛡️ Zero Tracking</text>

  <!-- Profile Badge -->
  <rect x="970" y="60" width="200" height="28" rx="6" fill="#161824" />
  <circle cx="985" cy="74" r="6" fill="#d4af37" />
  <text x="1000" y="78" fill="#f4f4f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Profile: Isolated Dev (Sandbox-1)</text>

  <!-- Browser Body Content Split -->
  <!-- Left Side: Rafail AI Copilot Sidebar (width: 340) -->
  <rect x="0" y="100" width="340" height="615" fill="#0c0d14" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  
  <rect x="18" y="120" width="304" height="42" rx="8" fill="#151724" stroke="rgba(212,175,55,0.3)" stroke-width="1" />
  <text x="32" y="146" fill="#e5c158" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✦ RAFAIL AI COPILOT</text>
  <text x="245" y="145" fill="#2a9d8f" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ACTIVE</text>

  <!-- AI Chat / Context bubble -->
  <rect x="18" y="180" width="304" height="120" rx="10" fill="#13141f" stroke="rgba(255,255,255,0.05)" />
  <text x="32" y="205" fill="#8e90a6" font-family="system-ui, sans-serif" font-size="11">PAGE ANALYSIS SUMMARY</text>
  <text x="32" y="230" fill="#f4f4f7" font-family="system-ui, sans-serif" font-size="12" font-weight="500">• Document parsed: 4,200 words</text>
  <text x="32" y="252" fill="#f4f4f7" font-family="system-ui, sans-serif" font-size="12" font-weight="500">• Zero ad trackers detected & blocked</text>
  <text x="32" y="274" fill="#d4af37" font-family="system-ui, sans-serif" font-size="12" font-weight="500">• 3 key architectural insights extracted</text>

  <!-- AI Prompt Box -->
  <rect x="18" y="650" width="304" height="46" rx="8" fill="#151722" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
  <text x="32" y="678" fill="#787a91" font-family="system-ui, sans-serif" font-size="12">Ask Rafail AI about this page...</text>
  <circle cx="295" cy="673" r="12" fill="#d4af37" />
  <text x="290" y="677" fill="#000" font-size="12" font-weight="700">➔</text>

  <!-- Right Side: Main Web Canvas -->
  <rect x="340" y="100" width="860" height="615" fill="#090a10" />

  <!-- Main Web Canvas Content -->
  <rect x="380" y="130" width="780" height="180" rx="12" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.07)" />
  <text x="410" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Next-Generation Intelligent Browsing</text>
  <text x="410" y="205" fill="#a0a2b5" font-family="system-ui, sans-serif" font-size="14">Engineered by Xtremerpie with native Rafail AI contextual intelligence, multi-profile isolation, and zero telemetry.</text>
  
  <rect x="410" y="230" width="140" height="36" rx="6" fill="url(#goldAccent)" />
  <text x="430" y="253" fill="#090a10" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EXPLORE DOCS</text>

  <!-- Code Block in Viewport -->
  <rect x="380" y="330" width="780" height="230" rx="12" fill="#0d0e17" stroke="rgba(212,175,55,0.2)" />
  <text x="405" y="365" fill="#787a91" font-family="monospace" font-size="12">// Xtreme AI Browser - Identity Sandbox Isolation Matrix</text>
  <text x="405" y="395" fill="#ff7385" font-family="monospace" font-size="13">const <tspan fill="#e5c158">sandboxSession</tspan> = await <tspan fill="#64dfdf">XtremeBrowser</tspan>.createIdentity({</text>
  <text x="435" y="425" fill="#f4f4f7" font-family="monospace" font-size="13">profileId: <tspan fill="#a7c957">"developer-sandbox-01"</tspan>,</text>
  <text x="435" y="450" fill="#f4f4f7" font-family="monospace" font-size="13">telemetryBlocked: <tspan fill="#e5c158">true</tspan>,</text>
  <text x="435" y="475" fill="#f4f4f7" font-family="monospace" font-size="13">rafailCopilot: <tspan fill="#e5c158">true</tspan></text>
  <text x="405" y="505" fill="#ff7385" font-family="monospace" font-size="13">});</text>

  <!-- Bottom Status Ribbon -->
  <rect x="0" y="715" width="1200" height="35" rx="0 0 16 16" fill="#08080d" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text x="25" y="737" fill="#787a91" font-family="monospace" font-size="11">SYSTEM: ONLINE</text>
  <text x="160" y="737" fill="#2a9d8f" font-family="monospace" font-size="11">TRACKERS BLOCKED: 18</text>
  <text x="330" y="737" fill="#e5c158" font-family="monospace" font-size="11">RAM CONSUMPTION: 184 MB</text>
  <text x="1050" y="737" fill="#a0a2b5" font-family="system-ui, sans-serif" font-size="11">Xtreme Core v0.6.0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" fill="none">
  <defs>
    <linearGradient id="awakenBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11121c" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a671c" />
    </linearGradient>
  </defs>

  <!-- Awaken App Window Frame -->
  <rect x="0" y="0" width="1000" height="650" rx="16" fill="url(#awakenBgGrad)" stroke="rgba(212,175,55,0.3)" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="50" rx="16 16 0 0" fill="#0b0c13" />
  <circle cx="28" cy="25" r="6" fill="#e63946" />
  <circle cx="48" cy="25" r="6" fill="#d4af37" />
  <circle cx="68" cy="25" r="6" fill="#2a9d8f" />
  <text x="100" y="31" fill="#e5c158" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AWAKEN v1.0.0 — Hourly Wake-up & Alert Utility</text>

  <!-- Circular Countdown Timer Area -->
  <circle cx="340" cy="330" r="160" stroke="rgba(255,255,255,0.06)" stroke-width="12" />
  <path d="M 340 170 A 160 160 0 1 1 200 420" stroke="url(#goldRing)" stroke-width="14" stroke-linecap="round" />
  
  <text x="340" y="300" text-anchor="middle" fill="#8e90a6" font-family="monospace" font-size="16" letter-spacing="2">NEXT ALERT IN</text>
  <text x="340" y="360" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800">42:18</text>
  <text x="340" y="400" text-anchor="middle" fill="#d4af37" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Interval: Every 60 Minutes</text>

  <!-- Right Settings Panel -->
  <rect x="560" y="90" width="390" height="490" rx="14" fill="#131522" stroke="rgba(255,255,255,0.06)" />
  <text x="590" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Alert Audio Preferences</text>

  <!-- Audio File Row -->
  <rect x="590" y="160" width="330" height="60" rx="8" fill="#191c2b" stroke="rgba(212,175,55,0.25)" />
  <text x="610" y="185" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVE SOUND CUE</text>
  <text x="610" y="206" fill="#f4f4f7" font-family="monospace" font-size="13">Zen_Temple_Chime_320k.mp3</text>

  <!-- Custom File Load Button -->
  <rect x="590" y="240" width="330" height="40" rx="8" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.5)" stroke-width="1" />
  <text x="690" y="265" fill="#e5c158" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Browse Custom Audio...</text>

  <!-- Toggles -->
  <text x="590" y="325" fill="#a0a2b5" font-family="system-ui, sans-serif" font-size="13">Minimize to System Tray on Close</text>
  <rect x="870" y="310" width="50" height="26" rx="13" fill="#d4af37" />
  <circle cx="905" cy="323" r="10" fill="#0b0c13" />

  <text x="590" y="375" fill="#a0a2b5" font-family="system-ui, sans-serif" font-size="13">Gaming / Full-screen DND Mode</text>
  <rect x="870" y="360" width="50" height="26" rx="13" fill="#d4af37" />
  <circle cx="905" cy="373" r="10" fill="#0b0c13" />

  <text x="590" y="425" fill="#a0a2b5" font-family="system-ui, sans-serif" font-size="13">Launch on Windows Startup</text>
  <rect x="870" y="410" width="50" height="26" rx="13" fill="#d4af37" />
  <circle cx="905" cy="423" r="10" fill="#0b0c13" />

  <!-- Action button -->
  <rect x="590" y="480" width="330" height="50" rx="10" fill="url(#goldRing)" />
  <text x="695" y="512" fill="#090a10" font-family="system-ui, sans-serif" font-size="14" font-weight="800">TEST AUDIO ALERT</text>

  <!-- Footer status -->
  <text x="40" y="615" fill="#6c6f85" font-family="monospace" font-size="12">STATUS: RUNNING IN BACKGROUND | RAM: 18.4 MB | TRAY: ACTIVE</text>
</svg>
